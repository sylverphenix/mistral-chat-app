<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    #chat {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1.1rem; padding: 1rem; margin: 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg {
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      max-width: 80%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #0a84ff; color: #fff; }
    .assistant { align-self: flex-start; background: #e4e4e7; color: #111; }
    .error { align-self: center; background: #fee2e2; color: #991b1b; font-size: 0.85rem; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
    }
    input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #0a84ff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="chat">
    <h1>Chat Mistral (mistral-small-latest)</h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Votre message…" autocomplete="off" />
      <button id="send">Envoyer</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      addMessage("user", text);
      history.push({ role: "user", content: text });
      const pending = addMessage("assistant", "…");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-20) }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur inconnue");
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = err.message;
        history.pop();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
